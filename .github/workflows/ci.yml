# CI/CD for TripMate AI
#
#   checks       backend syntax check, unit tests, frontend production build
#   integration  Firebase emulators (Auth + Firestore) + backend + mock LLM, end-to-end API tests
#   deploy       main only, after both pass: Firestore rules and indexes (works on the
#                free Spark plan). Render (API) and Vercel (frontend) deploy themselves
#                from GitHub on every push to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  checks:
    name: Unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Install backend
        run: npm ci
        working-directory: backend

      - name: Check backend loads
        run: npm run check
        working-directory: backend

      - name: Unit tests
        run: npm test
        working-directory: backend

      - name: Production build
        run: npm run build
        working-directory: frontend

  integration:
    name: End-to-end API tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      FIREBASE_PROJECT_ID: demo-tripmate
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      LLM_API_KEY: mock-llm-key
      LLM_BASE_URL: http://127.0.0.1:8787/v1
      AI_RATE_LIMIT_PER_HOUR: 8
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # The Firestore emulator needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Start Firebase emulators
        run: |
          npm run emulators > emulators.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:9099 > /dev/null && curl -sf http://127.0.0.1:8080 > /dev/null && exit 0
            sleep 2
          done
          cat emulators.log; exit 1

      - name: Start mock LLM
        run: |
          npm run mock-llm > mock-llm.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/calls && exit 0; sleep 1; done
          cat mock-llm.log; exit 1

      - name: Start backend
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$API_URL/health" && exit 0; sleep 1; done
          cat server.log; exit 1

      - name: Integration tests
        run: npm run test:integration

      - name: Logs on failure
        if: failure()
        run: |
          echo "::group::Backend"; cat server.log || true; echo "::endgroup::"
          echo "::group::Emulators"; cat emulators.log || true; echo "::endgroup::"
          echo "::group::Mock LLM"; cat mock-llm.log || true; echo "::endgroup::"

  deploy:
    name: Deploy Firestore rules
    needs: [checks, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Check deploy settings
        id: secrets
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_PROJECT" ]; then
            echo "::notice::Deploy skipped: set the FIREBASE_SERVICE_ACCOUNT secret and FIREBASE_PROJECT_ID variable in the production environment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend
        if: steps.secrets.outputs.ready == 'true'
        working-directory: backend
        run: npm ci

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          unset FIREBASE_SERVICE_ACCOUNT
          backend/node_modules/.bin/firebase deploy --project "$FIREBASE_PROJECT" --only firestore --non-interactive
